services:
  - type: web
    name: forecastx-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: ForecastX
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: fallback
      - key: DATABASE_URL
        value: sqlite:///./forecastx.db
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: forecastx-web
    runtime: static
    region: singapore
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
